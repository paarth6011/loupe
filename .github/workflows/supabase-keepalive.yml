name: Supabase keepalive

# Supabase's free tier pauses a project after ~7 days of inactivity. Since end-user
# auth now sits on the login path (Phase 2), a paused project means nobody can sign
# in — so this is load-bearing, not a nicety. A scheduled ping to the Auth health
# endpoint keeps the project warm.
#
# Inactive until the repo has the SUPABASE_URL / SUPABASE_ANON_KEY secrets set
# (i.e. once the Supabase project exists): the job no-ops when they're empty, so
# this can merge ahead of the project being created.

on:
  schedule:
    # Every 3 days at 07:00 UTC — comfortably inside the ~7-day idle window.
    - cron: "0 7 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Auth health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY not set — no project yet, skipping."
            exit 0
          fi
          # GoTrue's health endpoint keeps the Auth service (the login path) warm.
          url="${SUPABASE_URL%/}/auth/v1/health"
          echo "Pinging $url"
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" "$url")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Unexpected status from Supabase health endpoint" >&2
            exit 1
          fi
