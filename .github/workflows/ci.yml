name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo. Release workflows that need
# write/OIDC declare their own scopes. Runs on `pull_request` (not
# `pull_request_target`) and uses no secrets, so fork PRs can't exfiltrate.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres so the row-level-security isolation test (test_tenant_isolation.py)
    # actually runs — it is skipped without TEST_DATABASE_URL. The rest of the
    # suite uses in-memory SQLite and ignores this.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" ruff
      - run: ruff check loupe tests
      - run: ruff format --check loupe tests
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # Dependency vulnerability audit. Advisory only — deliberately NOT in
  # ci-success's `needs`, so a freshly-disclosed CVE (especially an unfixable
  # transitive one) surfaces as a red check without blocking every merge.
  # Dependabot proposes the upgrades; this flags what to prioritize.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: pip-audit (backend requirements)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: npm audit (frontend, production deps)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # Single required check for branch protection. Depends on every job above, so
  # the ruleset only ever needs to require "ci-success" — add/rename jobs freely
  # without touching branch protection. `if: always()` ensures this runs even
  # when a dependency fails, so a failure is reported (not skipped).
  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    needs: [backend, sdk, frontend]
    if: always()
    steps:
      - name: Verify all required jobs passed
        run: |
          if echo '${{ join(needs.*.result, ' ') }}' | grep -qvE '^success( success)*$'; then
            echo "One or more required jobs did not succeed: ${{ join(needs.*.result, ', ') }}"
            exit 1
          fi
          echo "All required jobs passed."
