# Production single-host stack: backend + Postgres + Redis + frontend, all behind
# Caddy (which terminates HTTPS with an automatic Let's Encrypt cert). Designed
# for one VM (e.g. a GCP e2-micro free instance) — see DEPLOY-gcp.md.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy is exposed to the internet (80/443); everything else talks over the
# private compose network. The frontend is served at / and the API at /api on the
# SAME host, so the dashboard and API are same-origin (no CORS needed).
name: loupe

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cloudops}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudops}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    # Image default is `sh start.sh`: runs migrations when RUN_MIGRATIONS=1, then
    # serves uvicorn on $PORT (8080). Safe to migrate-on-start for a single instance.
    environment:
      ENVIRONMENT: production
      RUN_MIGRATIONS: "1"
      # Owner connection: runs migrations (DDL + RLS policies). The app SERVES as
      # the restricted loupe_app role instead (so RLS binds) when APP_DB_PASSWORD
      # is set — the backend derives that connection itself from this same host/db.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cloudops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cloudops}
      APP_DB_USER: ${APP_DB_USER:-loupe_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set a strong JWT_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set a strong ADMIN_PASSWORD in .env}
      # Supabase end-user auth (Phase 2). Set SUPABASE_URL to verify the modern
      # asymmetric (ES256/JWKS) tokens — preferred. SUPABASE_JWT_SECRET is the
      # legacy shared-HS256 fallback. Both empty disables the path entirely, so
      # the self-host admin login is unaffected.
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      # Allowed CORS origins (comma-separated). Defaults to the same-origin
      # self-host dashboard (PUBLIC_URL). Set CORS_ORIGINS in .env to add a
      # separately-hosted frontend, e.g. a Vercel SaaS deploy:
      #   CORS_ORIGINS=https://your-host.duckdns.org,https://your-app.vercel.app
      CORS_ORIGINS: ${CORS_ORIGINS:-${PUBLIC_URL}}
      SUMMARY_PROVIDER: ${SUMMARY_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-claude-haiku-4-5}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Vite bakes this at build time. The SPA calls the API under /api on the
        # same public host → same-origin, no CORS. Change PUBLIC_URL ⇒ rebuild.
        VITE_API_URL: ${PUBLIC_URL}/api
        # Empty by default → self-host uses the single-admin login. Set BOTH to
        # run this self-host build in Supabase mode (rebuild required). The hosted
        # SaaS frontend is built separately on Vercel with these set.
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN (your duckdns host) in .env}
      # Optional dedicated API subdomain (e.g. api.getloupe.net). Unset →
      # falls back to an internal-only address so Caddy serves just the main
      # host (no public cert issued). Set it (and point a DNS-only A record at
      # this box) to expose the API on its own hostname for a separately-hosted
      # SaaS frontend. The `:-` default guarantees Caddy never sees an empty
      # site address (which would be a config error).
      API_DOMAIN: ${API_DOMAIN:-localhost:8081}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # persisted certs — don't lose this or you re-issue every restart
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
