[project]
name = "loupe"
version = "0.1.0"
description = "Python SDK for Loupe — observability for LLM apps (latency, tokens, cost, errors)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loupe"]
