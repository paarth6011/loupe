# Distribution name is `loupe-llm` (the plain `loupe` is taken on PyPI); the
# import name stays `loupe`, so users `pip install loupe-llm` then
# `from loupe import track`.
[project]
name = "loupe-llm"
version = "0.1.0"
description = "Python SDK for Loupe — observability for LLM apps (latency, tokens, cost, errors)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["llm", "observability", "monitoring", "anthropic", "openai", "tokens", "cost", "tracing"]
dependencies = ["httpx>=0.28.1"]

[project.urls]
Homepage = "https://github.com/paarth6011/loupe"
Repository = "https://github.com/paarth6011/loupe"
Issues = "https://github.com/paarth6011/loupe/issues"

[project.optional-dependencies]
dev = ["pytest>=8.4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loupe"]
